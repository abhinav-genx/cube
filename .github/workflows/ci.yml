name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Expo pins react 19.3.0 while react-dom 19.3.1 (a peer of Expo Router) asks for 19.3.1;
      # the lockfile records the working set, so skip npm's strict peer check like local installs do.
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
