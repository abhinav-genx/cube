plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.cube'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.cubenative"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'androidx.biometric:biometric:1.1.0'
  // CubeCrypto against the JavaScript implementation's vectors (tests/native/README in the repo).
  testImplementation 'junit:junit:4.13.2'
}
